<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Procura video stage</title>
<style>
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;src:url("assets/fonts/instrument-serif-italic.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;src:url("assets/fonts/instrument-serif.woff2") format("woff2")}
@font-face{font-family:"Inter V";font-weight:100 900;src:url("assets/fonts/inter.woff2") format("woff2")}
@font-face{font-family:"JB Mono";font-weight:100 800;src:url("assets/fonts/jetbrains-mono.woff2") format("woff2")}
:root{--bg:#050806;--ink:#e9f0e6;--mut:#8da092;--dim:#5d6b60;--line:#1c261f;--line2:#2a3a2f;--lime:#b7f36b;--amber:#e0a94b;--red:#ef7f78;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Inter V",system-ui,sans-serif;--mono:"JB Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
#scenes{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:2}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em}
.mono{font-family:var(--mono)}
.kicker{font-family:var(--mono);font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:16px}
.kicker::before{content:"";width:34px;height:2px;background:var(--lime)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1.5px solid var(--line2);border-radius:26px;backdrop-filter:blur(4px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lime{color:var(--lime)} .amber{color:var(--amber)} .red{color:var(--red)}
#bgglow{position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 42%,rgba(183,243,107,.075),transparent 70%)}
#grid{position:absolute;inset:-60px;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 80%);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 80%)}
#vig{position:absolute;inset:0;background:radial-gradient(100% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none;z-index:40}
#grain{position:absolute;left:-100px;top:-100px;width:2120px;height:1280px;opacity:.028;z-index:41;pointer-events:none;mix-blend-mode:screen}
#sub{position:absolute;left:0;right:0;bottom:58px;text-align:center;z-index:50;pointer-events:none}
#sub span{display:inline-block;max-width:1400px;padding:12px 26px;border-radius:14px;background:rgba(5,8,6,.62);backdrop-filter:blur(6px);font:500 34px/1.3 var(--sans);color:#f1f6ee;letter-spacing:-.005em}
#note{position:absolute;right:140px;top:104px;z-index:50;font:500 20px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;opacity:0}
#bar{position:absolute;left:0;bottom:0;height:3px;background:var(--lime);z-index:60;width:0}
.chip{position:absolute;left:50%;width:1040px;height:118px;margin-left:-520px;display:flex;align-items:center;gap:26px;padding:0 40px;font:600 44px var(--sans);letter-spacing:-.02em}
.chip i{width:46px;height:46px;border-radius:50%;background:rgba(239,127,120,.15);border:2px solid var(--red);display:grid;place-items:center;color:var(--red);font:700 26px var(--sans);flex:none}
.lbl{font-family:var(--mono);font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;align-items:center;justify-content:space-between}
.btnp{display:inline-flex;align-items:center;gap:14px;padding:22px 40px;border-radius:999px;background:var(--lime);color:#0a1208;font:700 30px var(--sans)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <div id="bgglow"></div><div id="grid"></div>
  <div id="scenes"></div>
  <div id="vig"></div><canvas id="grain" width="640" height="360"></canvas>
  <div id="sub"><span></span></div>
  <div id="note"></div><div id="bar"></div>
</div>
<script src="build/timeline.js"></script>
<script>
// ------------------------------------------------------------------ helpers
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={out:x=>1-Math.pow(1-x,3),out5:x=>1-Math.pow(1-x,5),inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,expo:x=>x>=1?1:1-Math.pow(2,-10*x),
  back:x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},lin:x=>x};
const P=(t,a,d=.6,f=E.out)=>f(clamp((t-a)/d));          // eased progress starting at a
const mix=(a,b,k)=>a+(b-a)*k;
const px=v=>v.toFixed(2)+"px";
function el(tag,cls,parent,html,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e}
function setT(e,x=0,y=0,s=1,r=0,o=1,blur=0,extra=""){e.style.transform=`translate(${px(x)},${px(y)}) scale(${s}) rotate(${r}deg) ${extra}`;e.style.opacity=o;e.style.filter=blur>0.05?`blur(${blur.toFixed(2)}px)`:""}
function seedRand(n){let s=n*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function typed(text,t,start,cps){const n=Math.floor(clamp((t-start)*cps,0,text.length));return text.slice(0,n)}
const blink=t=>(Math.floor(t*2.2)%2===0)?1:0;
const TL=window.TL; const SC={}; TL.scenes.forEach(s=>SC[s.id]=s);
function scr(rowParent,w,h,x,y){return el("div","abs",rowParent,null,{left:px(x),top:px(y),width:px(w),height:px(h)})}
const ICON={
  leaf:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#0a1208" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19c3-5 6-8 10-10"/></svg>',
  lock:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><rect x="3" y="8" width="18" height="11" rx="2.5"/><circle cx="16.5" cy="13.5" r="1.1" fill="currentColor"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  phone:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  finger:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11v4c0 2-.4 3.6-1.2 5"/><path d="M8.5 20c.8-1.6 1.1-3.2 1.1-5v-3a2.4 2.4 0 0 1 4.8 0v2.5c0 2.4.5 4.2 1.6 6"/><path d="M5.5 17c.7-1.6 1-3.4 1-5.4a5.5 5.5 0 0 1 11 0c0 1.5.1 2.7.4 3.9"/><path d="M4 9a8 8 0 0 1 16 0"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>'
};
function logo(parent,size){const w=el("div","abs",parent,null,{display:"flex",alignItems:"center",gap:px(size*.28)});
  const m=el("div",null,w,ICON.leaf,{width:px(size),height:px(size),borderRadius:px(size*.3),background:"var(--lime)",padding:px(size*.22),flex:"none",boxShadow:"0 0 "+px(size*.7)+" rgba(183,243,107,.35)"});
  const t=el("div",null,w,"Procura",{font:`800 ${size*.9}px var(--sans)`,letterSpacing:"-.04em"});return {w,m,t}}

// ------------------------------------------------------------------ rack footage (real landing page frames)
const RACK_N=200; const rackImgs=[];
const rackLayer=el("div","abs",document.getElementById("stage"),null,{inset:0,zIndex:1,opacity:0});
rackLayer.style.left=0;rackLayer.style.top=0;rackLayer.style.width="1920px";rackLayer.style.height="1080px";
const rA=el("img","abs",rackLayer,null,{left:0,top:0,width:"1920px",height:"1080px"});
const rB=el("img","abs",rackLayer,null,{left:0,top:0,width:"1920px",height:"1080px"});
const rackShade=el("div","abs",rackLayer,null,{inset:0,left:0,top:0,width:"1920px",height:"1080px"});
function rack(f,opacity,scale,dx,dy,shade){ // f: fractional frame index
  const i=clamp(Math.floor(f),0,RACK_N-1), j=clamp(i+1,0,RACK_N-1), k=f-i;
  const src=n=>"assets/rack/f"+String(n).padStart(3,"0")+".jpg";
  if(rA.dataset.s!==src(i)){rA.src=src(i);rA.dataset.s=src(i)} if(rB.dataset.s!==src(j)){rB.src=src(j);rB.dataset.s=src(j)}
  rB.style.opacity=k; rA.style.opacity=1;
  rackLayer.style.transformOrigin="100% 50%"; rackLayer.style.opacity=opacity; rackLayer.style.transform=`translate(${px(dx)},${px(dy)}) scale(${scale})`;
  rackShade.style.background=shade||"transparent";
}
const SHADE="radial-gradient(ellipse 620px 420px at 94% 98%,rgba(5,8,6,.97),rgba(5,8,6,0)),linear-gradient(90deg,rgba(5,8,6,.97) 0%,rgba(5,8,6,.9) 30%,rgba(5,8,6,.4) 62%,rgba(5,8,6,.12) 100%),linear-gradient(180deg,rgba(5,8,6,.35),rgba(5,8,6,.5))";
const stage=document.getElementById("scenes");
const scenes={};
function mk(id){const r=el("div","scene",stage);r.id="sc-"+id;scenes[id]={root:r};return r}

// ================================================================== S1 HOOK
(function(){const r=mk("hook");
  const top=el("div","abs serif",r,null,{left:0,right:0,top:"120px",textAlign:"center",fontSize:"84px",lineHeight:1.08,color:"var(--ink)"});
  const l1=el("div",null,top,"Somewhere right now,");const l2=el("div",null,top,"someone is handing an AI their credit card.");
  const l3=el("div","abs serif",r,"and just hoping it <span style='color:var(--amber)'>behaves.</span>",{left:0,right:0,top:"150px",textAlign:"center",fontSize:"96px",opacity:0});
  const scn=el("div","abs",r,null,{left:"560px",top:"330px",width:"800px",height:"420px",perspective:"1600px"});
  const card=el("div","abs",scn,null,{left:0,top:0,width:"800px",height:"420px",borderRadius:"34px",overflow:"hidden",
    background:"linear-gradient(135deg,#17231b 0%,#0b110d 55%,#121c15 100%)",border:"2px solid #2d4033",boxShadow:"0 40px 120px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)"});
  const sheen=el("div","abs",card,null,{inset:0,borderRadius:"34px",background:"linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 45%,transparent 60%)"});
  el("div","abs",card,null,{left:"58px",top:"70px",width:"96px",height:"72px",borderRadius:"14px",background:"linear-gradient(135deg,#e6c46f,#a8832e)",boxShadow:"inset 0 0 0 2px rgba(0,0,0,.2)"});
  el("div","abs mono",card,"•••• •••• •••• ••••",{left:"58px",top:"205px",fontSize:"52px",letterSpacing:".08em",color:"#cfd9cb"});
  el("div","abs mono",card,"YOUR NAME",{left:"58px",top:"322px",fontSize:"26px",letterSpacing:".2em",color:"#7e9084"});
  el("div","abs mono",card,"UNLIMITED",{right:"58px",top:"322px",fontSize:"26px",letterSpacing:".2em",color:"var(--red)"});
  const q=el("div","abs serif",card,"?",{right:"70px",top:"40px",fontSize:"130px",color:"var(--amber)",opacity:0});
  const bar=el("div","abs glass",r,null,{left:"420px",top:"850px",width:"1080px",height:"96px",borderRadius:"48px",display:"flex",alignItems:"center",padding:"0 38px",gap:"22px"});
  el("div","lbl",bar,"you",{});
  const txt=el("div",null,bar,"",{font:"500 34px var(--sans)",color:"var(--ink)",whiteSpace:"nowrap"});
  scenes.hook.update=t=>{
    const c=SC.hook.cues; const a=P(t,c.card,1.4,E.out5);
    const tilt=Math.sin(t*.7)*10, tilt2=Math.cos(t*.5)*6;
    const shake=t>c.hope?Math.exp(-(t-c.hope)*1.1)*9*Math.sin(t*55):0;
    card.style.transform=`translateY(${px((1-a)*220+shake*.5)}) rotateY(${-18+tilt}deg) rotateX(${8+tilt2}deg) rotateZ(${shake*.25}deg)`;
    card.style.opacity=a; card.style.borderColor=t>c.hope?`rgba(239,127,120,${clamp((t-c.hope)*.8)*.8})`:"#2d4033";
    sheen.style.transform=`translateX(${px(((t*120)%1200)-500)})`;
    q.style.opacity=P(t,c.hope,.6); q.style.transform=`scale(${mix(.6,1,P(t,c.hope,.7,E.back))}) rotate(${shake}deg)`;
    const tp=P(t,.9,1.0)*(1-P(t,7.7,.5)); setT(top,0,mix(30,0,P(t,.9,1.0)),1,0,tp,0);
    l1.style.opacity=P(t,.9,.8); l2.style.opacity=P(t,2.4,.8);
    const hp=P(t,8.0,.7); l3.style.opacity=hp; l3.style.transform=`translateY(${px((1-hp)*24)})`;
    const bp=P(t,.9,.7); setT(bar,0,(1-bp)*40,1,0,bp*(1-P(t,10.2,.6)*.35));
    txt.innerHTML=typed("Buy me a phone charger and label rolls. Under $20.",t,c.type,14)+`<span style="opacity:${blink(t)};color:var(--lime)">|</span>`;
  }})();

// ================================================================== S2 PROBLEM
(function(){const r=mk("problem");
  const hl=el("div","abs serif",r,"Hope is not a spending limit.",{left:0,right:0,top:"110px",textAlign:"center",fontSize:"112px"});
  const texts=["It overspends.","It buys the wrong thing.","Nobody can tell who approved it."]; const chips=[];
  texts.forEach((tx,i)=>{const c=el("div","chip glass",r,null,{top:px(330+i*160)});el("i",null,c,"✕");el("span",null,c,tx);
    const crack=el("div","abs",c,null,{left:"48%",top:0,width:"4px",height:"100%",background:"linear-gradient(180deg,transparent,rgba(255,255,255,.8),transparent)",opacity:0});chips.push({c,crack})});
  // logo reveal layer
  const wipe=el("div","abs",r,null,{left:0,top:0,width:"1920px",height:"1080px",background:"var(--lime)",transform:"translateY(100%)",zIndex:5});
  const hero=el("div","abs",r,null,{left:0,top:0,width:"1920px",height:"1080px",zIndex:6,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"36px",opacity:0});
  const lg=logo(hero,150); lg.w.style.position="relative";
  const tag=el("div","serif",hero,"An AI buyer that cannot overspend.",{fontSize:"86px",textAlign:"center",lineHeight:1,textShadow:"0 6px 50px rgba(0,0,0,.8)"});
  const sub=el("div","mono",hero,"find · prove · compare · you approve · capped payment",{fontSize:"26px",letterSpacing:".12em",color:"var(--mut)",textShadow:"0 2px 20px #000"});
  scenes.problem.update=t=>{
    const c=SC.problem.cues; const R=seedRand(5);
    hl.style.opacity=P(t,.4,.8)*(1-P(t,c.crack-.3,.5)); hl.style.transform=`translateY(${px((1-P(t,.4,.8))*26)})`;
    chips.forEach((o,i)=>{const t0=[c.f1,c.f2,c.f3][i],p=P(t,t0,.6,E.out5); const ct=t-c.crack-i*.07;
      if(ct<0){setT(o.c,0,(1-p)*70,mix(.94,1,p),0,p,(1-p)*10);o.crack.style.opacity=clamp((t-c.crack+.3)*3)*.9*(t>c.crack-.3?1:0)}
      else{const g=ct*ct*1900;const dir=i%2?1:-1;setT(o.c,dir*ct*260,g,1,dir*ct*38,clamp(1-ct*1.2),0);o.crack.style.opacity=.9}});
    const wp=P(t,c.logo-.15,.7,E.inOut); // wipe up then reveal
    wipe.style.transform=`translateY(${wp<.5?px(mix(1080,0,wp*2)):px(mix(0,-1080,(wp-.5)*2))}) `;
    const showHero=t>=c.logo+.1; hero.style.opacity=showHero?1:0;
    const hp=P(t,c.logo+.1,.9,E.out5); setT(lg.w,0,(1-hp)*40,mix(.9,1,hp),0,hp,0);
    const tp=P(t,c.tag,.9,E.out5); setT(tag,0,(1-tp)*30,1,0,tp,(1-tp)*8); setT(sub,0,0,1,0,P(t,c.tag+.8,.8));
    const fi=clamp((t-c.logo)/(16-c.logo));
    rack(mix(0,22,fi), P(t,c.logo+.2,1.2)*.85, 1.22+fi*.04, 0,0,SHADE);
  }})();

// ================================================================== S3 LIMITS
(function(){const r=mk("limits");
  el("div","kicker",r,"01 · your rules",{position:"absolute",left:"140px",top:"92px"});
  const hl=el("div","abs serif",r,"You set the rules.",{left:"140px",top:"140px",fontSize:"128px",lineHeight:1});
  const wal=el("div","abs glass row",r,null,{left:"140px",top:"330px",width:"1640px",height:"150px",padding:"0 48px"});
  const wl=el("div",null,wal,null,{display:"flex",alignItems:"center",gap:"30px"});
  el("div",null,wl,ICON.wallet,{width:"64px",height:"64px",color:"var(--lime)"});
  const wtx=el("div",null,wl,null,{});const w1=el("div",null,wtx,"Your wallet",{font:"600 38px var(--sans)"});const w2=el("div","mono",wtx,"Where the money comes from",{fontSize:"22px",color:"var(--dim)",marginTop:"6px"});
  const wst=el("div","mono",wal,"",{fontSize:"28px",display:"flex",alignItems:"center",gap:"16px"});
  const dot=el("i",null,wst,null,{width:"16px",height:"16px",borderRadius:"50%",background:"var(--amber)",display:"inline-block"});const wtext=el("span",null,wst,"Not connected");
  const defs=[{k:"lim1",l:"Monthly limit",v:500,s:"The most it can spend in a month."},{k:"lim2",l:"Per purchase",v:150,s:"The biggest single order."},{k:"lim3",l:"Always ask me",v:null,s:"Every order waits for you."}];
  const cards=defs.map((d,i)=>{const c=el("div","abs glass",r,null,{left:px(140+i*560),top:"540px",width:"520px",height:"290px",padding:"40px 44px"});
    el("div","lbl",c,d.l);const big=el("div","num",c,"",{fontSize:"110px",fontWeight:600,letterSpacing:"-.04em",marginTop:"26px",color:"var(--ink)"});
    el("div",null,c,d.s,{font:"400 24px/1.4 var(--sans)",color:"var(--mut)",marginTop:"14px"});return {c,big,d}});
  const lockw=el("div","abs",r,null,{left:"140px",top:"880px",width:"1640px",display:"flex",alignItems:"center",justifyContent:"center",gap:"26px"});
  const lk=el("div",null,lockw,ICON.lock,{width:"60px",height:"60px",color:"var(--lime)"});const sh=lk.querySelector(".shackle");
  el("div","serif",lockw,"Only you can change these. The agent cannot.",{fontSize:"58px"});
  scenes.limits.update=t=>{
    const c=SC.limits.cues; const hp=P(t,.2,.9,E.out5); setT(hl,0,(1-hp)*30,1,0,hp,(1-hp)*8);
    const wp=P(t,c.wallet-.5,.8,E.out5); setT(wal,0,(1-wp)*50,1,0,wp);
    const on=t>c.wallet+.6; dot.style.background=on?"var(--lime)":"var(--amber)"; dot.style.boxShadow=on?"0 0 18px var(--lime)":"none";
    wtext.innerHTML=on?`Connected · <span style="color:var(--ink)">0x7a3f…c91e</span> · USDC on Base`:"Connecting…"; wtext.style.color=on?"var(--lime)":"var(--amber)";
    wal.style.borderColor=on?"rgba(183,243,107,.55)":"";
    cards.forEach(o=>{const t0=c[o.d.k],p=P(t,t0-.2,.7,E.out5);setT(o.c,0,(1-p)*60,mix(.96,1,p),0,p);
      if(o.d.v!=null){const cp=P(t,t0,1.4,E.out);o.big.innerHTML="$"+Math.round(o.d.v*cp);}else{const tg=P(t,t0,.5,E.back);o.big.innerHTML=`<span style="display:inline-block;width:150px;height:76px;border-radius:40px;background:${tg>.5?"var(--lime)":"#26352a"};position:relative;vertical-align:middle"><i style="position:absolute;top:8px;left:${mix(8,82,tg)}px;width:60px;height:60px;border-radius:50%;background:#0a1208;${tg>.5?"":"background:#8da092"}"></i></span><span style="font-size:60px;margin-left:24px;color:${tg>.5?"var(--lime)":"var(--dim)"}">${tg>.5?"on":"off"}</span>`}

    dl.style.boxShadow=t>=c.pay?`0 30px 80px rgba(0,0,0,.45),0 0 ${70*clamp(1-(t-c.pay)*.6)}px rgba(183,243,107,.28)`:"";
  }})();

// ================================================================== S8 CALL
(function(){const r=mk("call");
  el("div","kicker",r,"05 · the call",{position:"absolute",left:"140px",top:"92px"});
  el("div","abs serif",r,"Procura can call vendors.",{left:"140px",top:"140px",fontSize:"112px",lineHeight:1});
  const ph=el("div","abs glass",r,null,{left:"140px",top:"320px",width:"680px",height:"600px",padding:"44px",display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center"});
  const ico=el("div","",ph,null,{width:"140px",height:"140px",borderRadius:"50%",background:"rgba(183,243,107,.12)",border:"2px solid var(--lime)",display:"grid",placeItems:"center",position:"relative",marginTop:"20px"});
  el("div",null,ico,ICON.phone,{width:"64px",height:"64px",color:"var(--lime)"});
  const pr=[0,1].map(i=>el("div","abs",ico,null,{left:"-2px",top:"-2px",width:"140px",height:"140px",borderRadius:"50%",border:"2px solid var(--lime)"}));
  el("div",null,ph,"A seller with no website",{font:"600 38px var(--sans)",marginTop:"34px",letterSpacing:"-.02em"});
  const stat=el("div","mono",ph,"calling…",{fontSize:"24px",letterSpacing:".14em",color:"var(--amber)",marginTop:"14px"});
  const wave=el("div",null,ph,null,{display:"flex",alignItems:"center",gap:"6px",height:"120px",marginTop:"34px"});
  const bars=[];for(let i=0;i<30;i++)bars.push(el("i",null,wave,null,{width:"8px",height:"10px",borderRadius:"4px",background:"var(--lime)",display:"block"}));
  const tr=el("div","abs",r,null,{left:"880px",top:"320px",width:"900px",display:"grid",gap:"20px"});
  const msgs=[["AI","Hello, this is an AI assistant calling for a customer. Do you have label rolls in stock?","c"],["Seller","Yes, we do. Eight fifty a roll, ships Tuesday.","s"]];
  const mr=msgs.map(m=>{const b=el("div","glass",tr,null,{padding:"26px 34px",borderRadius:"22px",opacity:0});el("div","lbl",b,m[0],{color:m[2]==="c"?"var(--lime)":"var(--mut)"});el("div",null,b,m[1],{font:"500 34px/1.3 var(--sans)",marginTop:"10px"});return b});
  const sm=el("div","abs glass",r,null,{left:"880px",top:"670px",width:"900px",height:"250px",padding:"34px 44px",opacity:0,borderColor:"rgba(183,243,107,.5)"});
  el("div","lbl",sm,"summary · nothing was agreed");const sg=el("div","row",sm,null,{marginTop:"24px"});
  [["In stock","yes"],["Price","$8.50 a roll"],["Ships","Tuesday"]].forEach(x=>{const d=el("div",null,sg,null);el("div","lbl",d,x[0]);el("div",null,d,x[1],{font:"600 40px var(--sans)",marginTop:"8px",letterSpacing:"-.02em"})});
  scenes.call.update=t=>{
    const c=SC.call.cues; const pp=P(t,.4,.9,E.out5); setT(ph,0,(1-pp)*50,1,0,pp);
    const live=t>=c.connect; stat.textContent=live?"live · it says it is an AI":"calling…"; stat.style.color=live?"var(--lime)":"var(--amber)";
    pr.forEach((p,i)=>{const k=((t*.8)+i*.5)%1;const on=!live&&t>c.ring;p.style.opacity=on?(1-k)*.9:0;p.style.transform=`scale(${1+k*1.1})`});
    bars.forEach((b,i)=>{const amp=live?(.35+.65*Math.abs(Math.sin(t*7+i*.6)*Math.sin(t*3.1+i*.25))):0;b.style.height=px(10+amp*100);b.style.opacity=live?1:.25});
    mr.forEach((b,i)=>{const t0=[c.t1,c.t2][i],p=P(t,t0,.6,E.out5);setT(b,0,(1-p)*30,1,0,p)});
    const sp=P(t,c.summary,.7,E.out5); setT(sm,0,(1-sp)*40,mix(.96,1,sp),0,sp);
  }})();

// ================================================================== S9 CLOSE
(function(){const r=mk("close");
  const led=el("div","abs",r,null,{left:"220px",top:"150px",width:"1480px"});
  el("div","lbl",led,"ledger · PR-0142 · append-only",{borderBottom:"2px solid var(--line2)",paddingBottom:"22px",fontSize:"24px"});
  const rowsd=[["request","PR-0142","phone charger and label rolls, under $20"],["found","3 baskets","one over budget, one risky"],["proved","2 of 3","sanctions, registry, email"],["approved","your passkey","fingerprint 3ce822a46a…"],["paid","inside the cap","held $23.48, unused refunded"],["call","summary only","in stock, $8.50, ships Tuesday"]];
  const lr=rowsd.map(x=>{const rw=el("div","row mono",led,null,{padding:"26px 0",borderBottom:"1.5px solid var(--line)",fontSize:"36px",opacity:0});el("span",null,rw,x[0],{color:"var(--dim)",width:"280px"});el("span",null,rw,x[1],{color:"var(--lime)",flex:"none",width:"420px"});el("span",null,rw,x[2],{color:"var(--mut)",fontSize:"28px",textAlign:"right",flex:1});return rw});
  const hero=el("div","abs",r,null,{left:0,top:0,width:"1920px",height:"1080px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"20px",opacity:0});
  const c1=el("div","serif",hero,"An AI that does the work,",{fontSize:"96px",textShadow:"0 6px 50px #000"});
  const c2=el("div","serif",hero,"but can only spend what you allowed.",{fontSize:"96px",color:"var(--ink)",textShadow:"0 6px 50px #000"});
  const key=el("div","abs",r,null,{left:0,top:0,width:"1920px",height:"1080px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"40px",opacity:0});
  const lg=logo(key,120);lg.w.style.position="relative";
  const k2=el("div","serif",key,"Let it work. Keep the key.",{fontSize:"128px",textShadow:"0 6px 60px #000"});
  const k3=el("div","mono",key,"Kite Passport · Neon · Better Auth",{fontSize:"24px",letterSpacing:".16em",color:"var(--mut)"});
  scenes.close.update=t=>{
    const c=SC.close.cues;
    const lp=P(t,.3,.6)*(1-P(t,c.close-.8,.8)); led.style.opacity=lp;
    lr.forEach((rw,i)=>{const p=P(t,c.ledger+i*.7,.5,E.out5);setT(rw,(1-p)*-40,0,1,0,p)});
    const fi=clamp((t-c.close+1)/12);
    rack(mix(150,199,fi),P(t,c.close-.6,1.4)*.9,1.2+fi*.05,0,-fi*10,SHADE);
    const h1=P(t,c.close,.9,E.out5), h2=P(t,c.close+2.1,.9,E.out5), fk=P(t,c.key,.9,E.out5);
    hero.style.opacity=h1*(1-fk); setT(c1,0,(1-h1)*30,1,0,h1,(1-h1)*8); setT(c2,0,(1-h2)*30,1,0,h2,(1-h2)*8);
    key.style.opacity=fk; setT(lg.w,0,(1-fk)*30,mix(.92,1,fk),0,1,0); setT(k2,0,(1-fk)*30,1,0,1,(1-fk)*10); k3.style.opacity=P(t,c.key+.9,.9);
  }})();

// ------------------------------------------------------------------ master
const noteEl=document.getElementById("note");const subEl=document.querySelector("#sub span"), subWrap=document.getElementById("sub"), barEl=document.getElementById("bar");
const gctx=document.getElementById("grain").getContext("2d");
function grain(frame){const g=seedRand(frame%17+1);const id=gctx.createImageData(640,360);for(let i=0;i<id.data.length;i+=4){const v=g()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gctx.putImageData(id,0,0);}
const grid=document.getElementById("grid");
window.seek=function(T){
  const frame=Math.round(T*TL.fps);
  let cur=null;for(const s of TL.scenes){if(T>=s.start&&T<s.start+s.dur)cur=s}
  if(!cur)cur=TL.scenes[TL.scenes.length-1];
  const lt=T-cur.start;
  for(const s of TL.scenes){scenes[s.id].root.style.opacity=0;scenes[s.id].root.style.visibility="hidden"}
  const f=P(lt,0,.5,E.out)*(1-clamp((lt-(cur.dur-.45))/.45));
  const root=scenes[cur.id].root; root.style.visibility="visible"; root.style.opacity=(cur.id==="hook"?P(lt,0,.5):f).toString();
  if(cur.id==="close"&&lt>cur.dur-.45)root.style.opacity="1"; // hold last frame
  if(cur.id!=="problem"&&cur.id!=="close")rack(0,0,1,0,0);
  scenes[cur.id].update(lt);
  // subtitles
  let line=null;for(const l of cur.vo){if(lt>=l.at-.05&&lt<=l.at+l.dur+.25)line=l}
  subEl.textContent=line?line.text:"";subWrap.style.opacity=line?clamp((lt-line.at+.05)/.25)*clamp((line.at+line.dur+.25-lt)/.25):0;
  grid.style.transform=`translate(${px(Math.sin(T*.2)*18)},${px((T*8)%64)})`;
  const NOTE={limits:"illustrative run · sample data",research:"illustrative run · sample data",prove:"illustrative run · sample data",confirm:"illustrative run · sample data",pay:"practice mode · sample data · real payments use the same gate",call:"illustrative run · sample data"};
  const nt=NOTE[cur.id]||"";noteEl.textContent=nt;noteEl.style.opacity=nt?clamp(lt/.8)*clamp((cur.dur-lt)/.5):0;
  barEl.style.width=(T/TL.total*100)+"%";
  if(frame%2===0||!window.__g){grain(frame);window.__g=1}
  document.getElementById("grain").style.transform=`translate(${(frame*37)%90}px,${(frame*53)%90}px)`;
  return true;
};
document.fonts.ready.then(()=>{window.__ready=true});
</script>
